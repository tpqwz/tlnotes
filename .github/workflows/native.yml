name: Native

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:sync
      - name: Build the Android package
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TLNOTES_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TLNOTES_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TLNOTES_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          chmod +x android/gradlew
          code=$(git rev-list --count HEAD)
          if [ "$code" -lt 5 ]; then code=5; fi
          export TLNOTES_VERSION_CODE="$code"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$TLNOTES_KEYSTORE_PASSWORD" ] && [ -n "$TLNOTES_KEY_ALIAS" ] && [ -n "$TLNOTES_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tlnotes.keystore"
            export TLNOTES_KEYSTORE="$RUNNER_TEMP/tlnotes.keystore"
            android/gradlew -p android assembleRelease
            cp android/app/build/outputs/apk/release/app-release.apk TLNotes.apk
          else
            echo "No signing key is stored in GitHub secrets. Building the debug package, which cannot update a copy signed with another key."
            android/gradlew -p android assembleDebug
            cp android/app/build/outputs/apk/debug/app-debug.apk TLNotes.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tlnotes-android
          path: TLNotes.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install @capacitor/ios@^8.5.3
      - run: npm run build:static
      - run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
          plist="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCalendarsFullAccessUsageDescription string TLNotes reads events already on this device so they can be added to the journal." "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSCalendarsFullAccessUsageDescription TLNotes reads events already on this device so they can be added to the journal." "$plist"
          /usr/libexec/PlistBuddy -c "Add :NSCalendarsUsageDescription string TLNotes reads events already on this device so they can be added to the journal." "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSCalendarsUsageDescription TLNotes reads events already on this device so they can be added to the journal." "$plist"
          /usr/libexec/PlistBuddy -c "Add :NSCalendarsWriteOnlyAccessUsageDescription string TLNotes does not add events to the phone calendar." "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSCalendarsWriteOnlyAccessUsageDescription TLNotes does not add events to the phone calendar." "$plist"
          iconset="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$iconset"
          sips -z 1024 1024 public/icons/icon-512.png --out "$iconset/AppIcon-1024.png"
          cat > "$iconset/Contents.json" << 'EOF'
          {
            "images": [
              { "filename": "AppIcon-1024.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          EOF
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - run: |
          app=$(find build/ios/Build/Products -name 'App.app' -type d | head -1)
          test -n "$app"
          ditto -c -k --keepParent "$app" TLNotes-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tlnotes-ios
          path: TLNotes-ios-simulator.zip

  release:
    needs: [android, ios]
    if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.android.result != 'cancelled' && needs.ios.result != 'cancelled' && (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: native
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          files=()
          if [ -f native/tlnotes-android/TLNotes.apk ]; then
            cp native/tlnotes-android/TLNotes.apk TLNotes.apk
            files+=(TLNotes.apk)
          fi
          if [ -f native/tlnotes-ios/TLNotes-ios-simulator.zip ]; then
            cp native/tlnotes-ios/TLNotes-ios-simulator.zip TLNotes-ios-simulator.zip
            files+=(TLNotes-ios-simulator.zip)
          fi
          test ${#files[@]} -gt 0
          notes=$(cat <<'EOF'
          Android: TLNotes.apk is signed with the key stored in the repository secrets. A newer build can be installed over an older one signed with that same key. A copy installed from an earlier debug package must be removed once before this one will install.

          iOS: TLNotes-ios-simulator.zip is an unsigned simulator build. It is not a signed iPhone app, and it will not install from this page. A phone build needs an Apple developer signature.
          EOF
          )
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            title="TLNotes ${tag}"
          else
            tag="latest"
            title="Latest builds"
            gh release delete latest --yes --cleanup-tag || true
          fi
          gh release create "$tag" --target "${GITHUB_SHA}" --prerelease --title "$title" --notes "$notes" "${files[@]}"
